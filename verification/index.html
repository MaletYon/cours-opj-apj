<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vérifier une attestation</title>
<style>
:root { --fond:#f4f6f9; --carte:#fff; --texte:#1e1e1e; --doux:#55606d; --bleu:#002f6c; --ok:#1b6b34; --okf:#e6f5ea; --ko:#a31515; --kof:#fdecec; --bord:#d3dae3; }
@media (prefers-color-scheme: dark) { :root { --fond:#0f1419; --carte:#1a2129; --texte:#e8edf2; --doux:#a7b3c0; --bleu:#8fb8f0; --ok:#7fdc9b; --okf:#14301e; --ko:#ff9a9a; --kof:#3a1a1a; --bord:#333f4c; } }
* { box-sizing:border-box; }
body { margin:0; padding:16px; background:var(--fond); color:var(--texte); font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif; }
main { max-width:640px; margin:0 auto; }
.carte { background:var(--carte); border:1px solid var(--bord); border-radius:8px; padding:18px; margin-bottom:14px; }
h1 { font-size:1.35rem; margin:0 0 4px; color:var(--bleu); }
.doux { color:var(--doux); font-size:.92rem; margin:0; }
textarea { width:100%; min-height:150px; margin:10px 0; padding:10px; font:14px/1.4 ui-monospace,Consolas,monospace; color:var(--texte); background:var(--fond); border:1px solid var(--bord); border-radius:6px; }
button { font:inherit; font-weight:600; padding:10px 16px; border-radius:6px; border:1px solid var(--bleu); background:var(--bleu); color:var(--carte); cursor:pointer; margin-right:8px; }
button.second { background:transparent; color:var(--bleu); }
video { width:100%; border-radius:6px; margin-top:10px; display:none; }
#res { display:none; }
#res.ok { display:block; background:var(--okf); border-color:var(--ok); }
#res.ko { display:block; background:var(--kof); border-color:var(--ko); }
#res h2 { margin:0 0 8px; font-size:1.15rem; }
#res.ok h2 { color:var(--ok); } #res.ko h2 { color:var(--ko); }
dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0; }
dt { font-weight:600; } dd { margin:0; overflow-wrap:anywhere; }
</style>
</head>
<body>
<main>
<div class="carte">
  <h1>Vérifier une attestation de fin de module</h1>
  <p class="doux">Formation des Officiers et des Agents de Police Judiciaire</p>
</div>
<div class="carte">
  <label for="t"><b>Contenu du QR code</b></label>
  <p class="doux">Scannez le code de l'attestation, ou collez ici le texte lu par l'application de votre téléphone.</p>
  <textarea id="t" spellcheck="false" autocomplete="off"></textarea>
  <button id="v" type="button">Vérifier</button><button id="s" type="button" class="second" hidden>Scanner</button>
  <video id="cam" playsinline muted></video>
</div>
<div class="carte" id="res" role="status"></div>
<p class="doux">La vérification se fait sur cet appareil : rien n'est envoyé. © MaletYon 2026</p>
</main>
<script>
(function () {
  "use strict";
  var JWK = {"kty": "EC", "crv": "P-256", "x": "iKwb8XLAGPceO0MPdQk8NNpDj6v3IFPn-zOy7NeNdA0", "y": "cixZUW2sx1CqXHNsA_9RZYxg3athbhDUjiVC4D0WW0Y"};
  var champ = document.getElementById("t"), res = document.getElementById("res");
  var scan = document.getElementById("s"), cam = document.getElementById("cam");

  function octets(b64u) {
    var s = b64u.replace(/-/g, "+").replace(/_/g, "/"), t = atob(s + "===".slice((s.length + 3) % 4)), o = new Uint8Array(t.length);
    for (var i = 0; i < t.length; i++) o[i] = t.charCodeAt(i);
    return o;
  }
  function afficher(ok, titre, note, lignes) {
    res.className = "carte " + (ok ? "ok" : "ko");
    res.textContent = "";
    var h = document.createElement("h2"); h.textContent = titre; res.appendChild(h);
    if (lignes) {
      var dl = document.createElement("dl");
      lignes.forEach(function (l) {
        var i = l.indexOf(" : "), dt = document.createElement("dt"), dd = document.createElement("dd");
        dt.textContent = l.slice(0, i); dd.textContent = l.slice(i + 3);
        dl.appendChild(dt); dl.appendChild(dd);
      });
      res.appendChild(dl);
    }
    var p = document.createElement("p"); p.style.margin = "0"; p.textContent = note; res.appendChild(p);
  }
  async function verifier() {
    var lignes = champ.value.replace(/\r/g, "").trim().split("\n").map(function (l) { return l.trim(); });
    var der = lignes.pop() || "";
    if (lignes.length !== 6 || der.indexOf("Signature : ") !== 0) {
      afficher(false, "Code non reconnu", "Ce texte n'a pas la forme d'une attestation signée. Considérez-la comme non vérifiée.");
      return;
    }
    try {
      var cle = await crypto.subtle.importKey("jwk", JWK, { name: "ECDSA", namedCurve: "P-256" }, false, ["verify"]);
      var bon = await crypto.subtle.verify({ name: "ECDSA", hash: "SHA-256" }, cle, octets(der.slice(12)), new TextEncoder().encode(lignes.join("\n")));
      if (bon) afficher(true, "Signature authentique", "Comparez ces informations avec celles imprimées sur l'attestation. Une seule différence signifie que le document a été modifié.", lignes);
      else afficher(false, "Attestation falsifiée", "La signature ne correspond pas à ces données. Ce code n'a pas été émis tel quel par le formateur.");
    } catch (e) {
      afficher(false, "Attestation falsifiée", "La signature est illisible ou invalide.");
    }
  }
  document.getElementById("v").onclick = verifier;
  if ("BarcodeDetector" in window && navigator.mediaDevices) {
    scan.hidden = false;
    scan.onclick = async function () {
      var flux = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      var d = new BarcodeDetector({ formats: ["qr_code"] });
      cam.srcObject = flux; cam.style.display = "block"; await cam.play();
      (async function boucle() {
        var r = await d.detect(cam).catch(function () { return []; });
        if (r.length) {
          flux.getTracks().forEach(function (t) { t.stop(); });
          cam.style.display = "none"; champ.value = r[0].rawValue; verifier();
        } else requestAnimationFrame(boucle);
      })();
    };
  }
})();
</script>
</body>
</html>
